<body>

  <div class="card auth-card" id="auth-card">
    
    <div class="auth-header">
      <div class="auth-logo-icon">
        <i class="fa-solid fa-sphere"></i>
      </div>
      <h1 class="auth-title">Sphere</h1>
      <p class="auth-subtitle">Conecte-se e interaja no seu universo próprio</p>
    </div>

    <div id="msg-erro" class="error-msg" role="alert"></div>

    <div id="auth-initial-buttons" class="auth-actions-group">
      <div id="contas-salvas-container" class="hidden"></div>

      <button type="button" class="btn-auth primary" onclick="mostrarTela('criar')">
        <i class="fa-solid fa-user-plus"></i> Criar uma conta
      </button>
      <button type="button" class="btn-auth secondary" onclick="mostrarTela('login')">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar em uma
      </button>

      <div class="auth-divider"><span>ou</span></div>

      <button type="button" class="btn-auth google-btn" onclick="entrarComGoogle()">
        <i class="fa-brands fa-google"></i> Continuar com o Google
      </button>
    </div>

    <div id="form-login" class="hidden">
      <div class="auth-input-group">
        <label for="login-username">E-mail ou @username</label>
        <div class="input-password-wrapper">
          <input type="text" id="login-username" placeholder="seuemail@exemplo.com ou @usuario" autocomplete="username" spellcheck="false" required />
        </div>
      </div>

      <div class="auth-input-group">
        <label for="login-senha">Senha</label>
        <div class="input-password-wrapper">
          <input type="password" id="login-senha" placeholder="••••••••" autocomplete="current-password" required />
          <i class="fa-solid fa-eye toggle-eye" id="login-eye" onclick="alternarVisibilidadeSenha('login-senha', 'login-eye')"></i>
        </div>
      </div>

      <div class="auth-buttons-row">
        <button type="button" class="btn-auth secondary" onclick="mostrarTela('inicial')">
          <i class="fa-solid fa-arrow-left"></i> Voltar
        </button>
        <button type="button" class="btn-auth primary" id="btn-entrar" onclick="entrar()">
          <i class="fa-solid fa-check"></i> Entrar
        </button>
      </div>
    </div>

    <div id="form-criar" class="hidden">
      <div class="step-indicator" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="3">
        <span class="step-dot active" id="dot-1"></span>
        <span class="step-dot" id="dot-2"></span>
        <span class="step-dot" id="dot-3"></span>
      </div>

      <div id="step-1" class="step-content">
        <div class="auth-input-group">
          <label for="criar-display-name">Nome de Exibição</label>
          <input type="text" id="criar-display-name" placeholder="Como quer ser chamado?" required />
        </div>

        <div class="auth-input-group">
          <label for="criar-username">Nome de Usuário (@handle)</label>
          <input type="text" id="criar-username" placeholder="seu_usuario" oninput="validarUsername(this)" autocomplete="username" spellcheck="false" required />
          <div id="username-check-feedback"></div>
        </div>

        <div class="auth-input-group">
          <label for="criar-email">E-mail de Recuperação (Opcional)</label>
          <input type="email" id="criar-email" placeholder="seuemail@exemplo.com" autocomplete="email" />
        </div>

        <div class="auth-input-group">
          <label for="criar-senha">Senha</label>
          <div class="input-password-wrapper">
            <input type="password" id="criar-senha" placeholder="Mínimo 4 caracteres" autocomplete="new-password" required />
            <i class="fa-solid fa-eye toggle-eye" id="criar-eye-1" onclick="alternarVisibilidadeSenha('criar-senha', 'criar-eye-1')"></i>
          </div>
        </div>

        <div class="auth-input-group">
          <label for="criar-confirmar">Confirmar Senha</label>
          <div class="input-password-wrapper">
            <input type="password" id="criar-confirmar" placeholder="Repita a senha" autocomplete="new-password" required />
            <i class="fa-solid fa-eye toggle-eye" id="criar-eye-2" onclick="alternarVisibilidadeSenha('criar-confirmar', 'criar-eye-2')"></i>
          </div>
        </div>
      </div>

      <div id="step-2" class="step-content hidden">
        <div class="auth-input-group">
          <label for="criar-nascimento">Data de Nascimento</label>
          <input type="date" id="criar-nascimento" required />
        </div>
      </div>

      <div id="step-3" class="step-content hidden">
        <div class="avatar-upload-box" onclick="abrirSeletorGaleriaAvatar()">
          <img id="criar-avatar-preview" src="https://ui-avatars.com/api/?background=ff2d55&color=fff&name=Sphere" alt="Avatar Preview" />
          <button type="button" class="btn-upload-avatar">
            <i class="fa-solid fa-camera"></i> Escolher Foto/GIF da Galeria
          </button>
          <input type="file" id="input-galeria-avatar" accept="image/*,image/gif" style="display: none;" onchange="processarAvatarGaleriaAuth(this)" />
        </div>

        <div class="turnstile-wrapper">
          <div id="turnstile-container" class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="dark"></div>
        </div>

        <div class="terms-acceptance-box">
          <label class="checkbox-container">
            <input type="checkbox" id="aceitar-termos" />
            <span class="checkmark"></span>
            <span class="terms-label-text">
              Concordo com os 
              <a href="#" onclick="event.preventDefault(); abrirVerificacaoTermos('termos');">Termos de Uso</a>, 
              <a href="#" onclick="event.preventDefault(); abrirVerificacaoTermos('privacidade');">Privacidade</a> e 
              <a href="#" onclick="event.preventDefault(); abrirVerificacaoTermos('seguranca');">Segurança</a>.
            </span>
          </label>
        </div>
      </div>

      <div class="auth-buttons-row">
        <button type="button" class="btn-auth secondary" onclick="voltarEtapa()">
          <i class="fa-solid fa-arrow-left"></i> Voltar
        </button>
        <button type="button" class="btn-auth primary" id="btn-step-avancar" onclick="avancarEtapa()">
          Avançar <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button type="button" class="btn-auth primary hidden" id="btn-step-criar" onclick="criarConta()">
          <i class="fa-solid fa-check"></i> Criar Conta
        </button>
      </div>
    </div>

    <div class="auth-footer-copyright">
      &copy; 2026 Sphere System. Todos os direitos reservados.
    </div>

  </div>

  <div id="home-screen" class="hidden">
    
    <div id="avatar-modal" class="avatar-modal hidden" role="dialog" aria-modal="true" aria-labelledby="avatar-modal-title">
      <h4 id="avatar-modal-title"><i class="fa-solid fa-image"></i> Alterar Foto do Avatar</h4>
      <input type="url" id="edit-avatar-input" placeholder="Cole a URL da nova foto..." spellcheck="false" />
      <div class="avatar-modal-btns">
        <button type="button" id="btn-salvar-avatar" onclick="salvarNovoAvatar()">
          <i class="fa-solid fa-floppy-disk"></i> Salvar Foto
        </button>
        <button type="button" class="sec" onclick="alternarMenuAvatar()">Cancelar</button>
      </div>
    </div>

    <main id="homecard-container" class="homecard-container"></main>

  </div>

  <div id="chat-media-modal-container"></div>

  <div id="chat-modals-portal"></div>
